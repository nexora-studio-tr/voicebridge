name: Local safety and demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: python -m pip install numpy==2.5.4 normalizer-tr==0.4.0
      - run: python -m unittest discover -s worker/tests -v
      - run: npx playwright install --with-deps chromium
      - run: npm run test:launcher
      - run: python scripts/package_source.py
      - run: npm run test:package
      - if: runner.os == 'Windows'
        run: npm run package:windows
      - if: runner.os == 'Windows'
        run: npm run test:windows -- --full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voicebridge-source-${{ matrix.os }}
          path: |
            artifacts/release/*
            artifacts/clean-install/report.json
            artifacts/clean-install/room-recovery-report.json
            artifacts/clean-install/room-reconnecting-en.png
            artifacts/clean-install/room-recovery-tr.png
            artifacts/clean-install/performance-report.json
            artifacts/clean-install/performance-en.png
            artifacts/clean-install/performance-mobile-en.png
            artifacts/launcher/report.json
            artifacts/launcher/accessibility.json
            artifacts/launcher/*.png
            artifacts/windows/validation.json
          retention-days: 14
