name: Beta feedback / Beta geri bildirimi
description: Report a fresh installation, a blocker or a translation test. Türkçe yazabilirsin.
title: '[Beta]: '
body:
  - type: markdown
    attributes:
      value: 'Use a short self-authored or synthetic example. Do not share recordings, credentials, operator links, databases, private IDs or personal conversations. Video gerekmiyor.'
  - type: input
    id: version
    attributes:
      label: Version / Sürüm
      placeholder: 0.1.0-alpha.5
    validations:
      required: true
  - type: dropdown
    id: participation
    attributes:
      label: Your participation / Katılım türün
      options:
        - Fresh full host installation / Temiz tam sunucu kurulumu
        - Existing host installation / Mevcut sunucu kurulumu
        - Guest on someone else's host / Başkasının kurulumunda misafir
        - Recorded demo only / Yalnızca kayıtlı demo
        - Setup blocked / Kurulumda takıldım
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: Tests tried / Denenenler
      multiple: true
      options:
        - Fresh installation / Temiz kurulum
        - Setup checks / Kurulum kontrolü
        - Recorded demo / Kayıtlı demo
        - Turkish to English / Türkçe → İngilizce
        - English to Turkish / İngilizce → Türkçe
        - Personal audio / Kişisel sesli dinleme
        - Consent or departure / İzin veya odadan ayrılma
    validations:
      required: true
  - type: dropdown
    id: participants
    attributes:
      label: Distinct humans / Farklı insan sayısı
      options:
        - One person / Tek kişi
        - Two or more people / İki veya daha fazla kişi
        - Synthetic only / Yalnızca sentetik
        - No live voice test / Canlı ses testi yapılmadı
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result / Genel sonuç
      options:
        - Worked / Çalıştı
        - Worked with issues / Sorunlarla çalıştı
        - Could not complete / Tamamlayamadım
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and setup / Ortam ve kurulum
      description: OS/browser and the setup result or blocked step. Hosts include Node/Python versions; guests need not. Broad CPU/RAM information is optional. No personal paths or device identifiers.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Recognition, translation and delay / Algılama, çeviri ve gecikme
      description: Optional for setup-only reports. State spoken/listening languages; compare original recognized text and intended translation separately. Add approximate delay or reproducible issues using non-sensitive examples.
  - type: checkboxes
    id: ledger_permission
    attributes:
      label: Evidence ledger / Doğrulama kaydı
      options:
        - label: You may link this public report in the beta ledger after review. / İnceleme sonrası bu herkese açık raporu beta kaydında bağlantılayabilirsin.
          required: false
